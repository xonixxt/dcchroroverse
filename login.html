<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Login - DC ChronoVerse</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components/btn.css">
    <link rel="stylesheet" href="css/components/badge.css">
    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/utilities.css">
 
<body>
    <main class="login-container">
        <section class="login-box">
            <header>
                <h1>DC ChronoVerse</h1>
                <p>Acesse a cronologia oficial</p>
            </header>
            <form action="cronologia.html">
                <div class="field">
                    <label for="user">Usuário</label>
                    <input type="text" id="user" name="user" required>
                </div>
                <div class="field">
                    <label for="pass">Senha</label>
                    <input type="password" id="pass" name="pass" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DC ChronoVerse - Projeto de Aplicações para Internet</p>
    </footer>
    
</body>
</html>
